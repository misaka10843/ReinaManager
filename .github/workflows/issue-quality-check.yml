name: Issue Quality Check
on:
  issues:
    types:
      - opened
      - edited


permissions:
  issues: write


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |


            const issue = context.payload.issue;

            const body = issue.body || "";

            const number = issue.number;


            const owner = context.repo.owner;

            const repo = context.repo.repo;



            // =========================
            // 误触关闭检测
            // =========================


            const trollWords = [

              "我承认自己没有阅读",
              "只是随意点击提交",
              "同意维护者可以无条件关闭",

              "I did not read the issue template",
              "submitted this randomly"

            ];


            if(
              trollWords.every(
                x => body.includes(x)
              )
            ){

              await github.rest.issues.update({

                owner,
                repo,
                issue_number:number,

                state:"closed"

              });


              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number:number,

                body:
                  `
                  🤡 Issue closed automatically.

                  The submission confirmed that the template was not read.
                  `

              });


              return;

            }



            // =========================
            // AI 空泛检测
            // =========================


            const patterns = [

              "提升用户体验",
              "显著提高",
              "赋能",
              "生态",
              "智能化",
              "未来发展",
              "非常重要",

              "improve user experience",
              "ecosystem",
              "significantly improve",
              "enhance"

            ];


            let score = 0;


            for(
              const p of patterns
            ){

              if(
                body.toLowerCase()
                .includes(
                  p.toLowerCase()
                )
              ){

                score++;

              }

            }


            if(body.length < 120){

              score++;

            }



            if(score >= 3){


              await github.rest.issues.addLabels({

                owner,
                repo,
                issue_number:number,

                labels:[
                  "needs-info"
                ]

              });


              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number:number,

                body:
                    `
                    ⚠️ More information is required.

                    Please explain:

                    - What problem are you actually facing?
                    - Your real usage scenario.
                    - Why the current behavior is insufficient.

                    Please avoid generic descriptions.
                    `
              });

            }